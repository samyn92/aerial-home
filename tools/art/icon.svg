<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 38 128 128" width="160" height="160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1636"/>
      <stop offset=".38" stop-color="#2f4279"/>
      <stop offset=".54" stop-color="#8d7596"/>
      <stop offset=".66" stop-color="#f0b18c"/>
      <stop offset="1" stop-color="#f7cfa6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4e4"/>
      <stop offset=".3" stop-color="#ffe0bd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffc28e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
